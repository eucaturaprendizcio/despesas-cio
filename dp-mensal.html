<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Total Mensal por Despesa</title>
  <link rel="stylesheet" href="css/dp-mensal.css">
</head>

<body>

  <header>
    <div class="header-content">
      <div class="brand">
        <h1>Análise de Despesas</h1>
        <p>Visão geral agregada por categoria</p>
      </div>
      <div class="filter-controls">
        <div class="input-group">
          <label>Mês de Referência:</label>
          <input type="month" id="filtroMes">
        </div>
        <button id="btnVoltar">Voltar ao Início</button>
      </div>
    </div>
  </header>

  <section class="resumo">
    <div class="kpi-item">
      <span class="kpi-label">Categorias no Mês</span>
      <strong id="kpiCategorias">0</strong>
    </div>
    <div class="kpi-item">
      <span class="kpi-label">Investimento Total</span>
      <strong id="kpiTotalGeral">R$ 0,00</strong>
    </div>
  </section>

  <main class="dashboard-main">
    <div class="cards-grid" id="gridDespesas">
    </div>
  </main>

  <main class="dashboard-main">


    <section class="grid-section">
      <div class="cards-grid" id="gridDespesas">
      </div>
    </section>

  </main>

  <script src="js/dp-mensal.js"></script>
  <script>
    // Bloqueia o clique com o botão direito do mouse
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Bloqueia atalhos de teclado específicos
    document.addEventListener('keydown', function (event) {
      // Bloqueia Ctrl+C (Copiar)
      if (event.ctrlKey && event.key === 'c') {
        event.preventDefault();
      }
      // Bloqueia Ctrl+U (Ver código fonte)
      if (event.ctrlKey && event.key === 'u') {
        event.preventDefault();
      }
      // Bloqueia Ctrl+Shift+I ou F12 (Tentar abrir o Elementos/F12)
      if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I')) {
        event.preventDefault();
      }
    });
  </script>
</body>

</html>
