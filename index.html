<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SGD</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" type="image/png" href="img/logotipo.png">
</head>

<body>
  <div class="card">
    <img src="img/logotipo.png" alt="Logo SGD" class="logo" />
    <h3>Login - SGD</h3>
    <p class="login-subtitle">Sistema de Gestão de Despesas - CIO</p>

    <form class="form" id="loginForm">
      <input type="text" id="usuario" required placeholder="Usuário" autocomplete="off" />

      <div class="senha-wrapper">
        <input type="password" id="senha" required placeholder="Senha" autocomplete="off" />
        <button type="button" id="toggleSenha" class="btn-olho" aria-label="Mostrar senha" aria-pressed="false">
          <svg class="icone-olho icone-olho-aberto" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <svg class="icone-olho icone-olho-fechado" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M10.6 5.2C11.06 5.07 11.53 5 12 5C19 5 23 12 23 12C22.6 12.7 21.9 13.7 20.9 14.7M6.6 6.6C3.6 8.3 1 12 1 12C1 12 5 19 12 19C13.9 19 15.5 18.5 16.9 17.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9.5 10.2C9.18 10.7 9 11.33 9 12C9 13.66 10.34 15 12 15C12.68 15 13.31 14.8 13.82 14.46" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <button type="submit" id="btnEntrar">Entrar no Painel</button>
      <span id="mensagemErro" class="msg-erro"></span>
    </form>
  </div>

  <script src="js/login.js"></script>
  <script>
    // Bloqueia o clique com o botão direito do mouse
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Bloqueia atalhos de teclado específicos
    document.addEventListener('keydown', function (event) {
      // Bloqueia Ctrl+C (Copiar)
      if (event.ctrlKey && event.key === 'c') {
        event.preventDefault();
      }
      // Bloqueia Ctrl+U (Ver código fonte)
      if (event.ctrlKey && event.key === 'u') {
        event.preventDefault();
      }
      // Bloqueia Ctrl+Shift+I ou F12 (Tentar abrir o Elementos/F12)
      if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I')) {
        event.preventDefault();
      }
    });
  </script>
</body>

</html>
