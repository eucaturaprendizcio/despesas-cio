<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SGD</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-box">
      <img src="img/logotipo.png" alt="Logo Sistema" class="login-logo">
      <p class="login-subtitle">Sistema de Gestão de Despesas - CIO</p>
      
      <form id="loginForm">
        <div class="input-group">
          <label for="usuario">Usuário</label>
          <input type="text" id="usuario" required placeholder="Digite seu usuário" autocomplete="off">
        </div>
        
        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required placeholder="Digite sua senha">
        </div>
        
        <button type="submit" id="btnEntrar">Entrar no Painel</button>
      </form>
      
      <p id="mensagemErro" class="msg-erro"></p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
