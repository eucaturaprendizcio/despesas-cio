<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitações</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/logotipo.png" type="image/png">
</head>

<body>

  <!-- HEADER -->
  <header>
    <img src="img/logotipo.png" class="logo" alt="Logo">

    <!-- Blocos de Informações Centrais -->
    <div class="header-info-container">
      <div class="info-block">
        <span class="info-label">Valor Anual da Categoria</span>
        <span class="info-value" id="valorAnual">R$ 0,00</span>
      </div>
      <div class="info-block">
        <span class="info-label">Última CEEM Registrada</span>
        <span class="info-value" id="ultimaCeem">—</span>
      </div>
    </div>

    <div class="search-box">
      <input id="search" type="text" placeholder="Pesquisar...">
      <button>Buscar</button>
      <button onclick="voltar()">Voltar</button>
    </div>
  </header>

  <!-- MARQUEE DE ÚLTIMOS REGISTROS -->
  <marquee id="marqueeRegistros" behavior="scroll" direction="left">
    Carregando último registro...
  </marquee>

  <!-- NOVO BANNER DA CATEGORIA -->
  <section id="categoryBanner" class="category-banner">
    <div class="banner-overlay">
      <h2 id="tituloCategoria"></h2>
    </div>
  </section>

  <div class="cards" id="lista"></div>

  <script src="js/categoria.js"></script>
  <script>
    // Bloqueia o clique com o botão direito do mouse
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Bloqueia atalhos de teclado específicos
    document.addEventListener('keydown', function (event) {
      // Bloqueia Ctrl+C (Copiar)
      if (event.ctrlKey && event.key === 'c') {
        event.preventDefault();
      }
      // Bloqueia Ctrl+U (Ver código fonte)
      if (event.ctrlKey && event.key === 'u') {
        event.preventDefault();
      }
      // Bloqueia Ctrl+Shift+I ou F12 (Tentar abrir o Elementos/F12)
      if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I')) {
        event.preventDefault();
      }
    });
  </script>
</body>

</html>
