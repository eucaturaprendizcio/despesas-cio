<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lançamento - SGD CIO</title>
  <link rel="stylesheet" href="css/lancamento.css">
  <link rel="icon" type="image/png" href="img/logotipo.png">
</head>

<body>

  <header>
    <div class="header-content">
      <div class="title-group">
        <img src="img/logotipo.png" alt="Logo SGD" class="logo-mini">
        <h2>Lançamentos</h2>
      </div>
      <button id="btnSair" class="btn-sair" title="Encerrar sessão">
        <span>Sair</span>
      </button>
    </div>
  </header>

  <main>
    <p class="boas-vindas">O que você deseja fazer agora?</p>

    <div class="acoes">
      <a class="acao-card acao-nota" id="btnNota"
        href="https://docs.google.com/forms/d/e/1FAIpQLSf8r6L7i4YMpbzHDhD2teKeEDDe_w1PxqVQ0feqYY_u4kTdBw/viewform"
        target="_blank" rel="noopener">
        <span class="acao-icone">🧾</span>
        <span class="acao-titulo">Lançamento de Nota Fiscal</span>
        <span class="acao-sub">Abre o formulário em uma nova aba</span>
      </a>

      <button class="acao-card acao-cnpj" id="btnCnpj">
        <span class="acao-icone">🏢</span>
        <span class="acao-titulo">Verificar CNPJ</span>
        <span class="acao-sub">Consultar dados por unidade CEEM</span>
      </button>
    </div>
  </main>

  <!-- MODAL: Verificar CNPJ (banner de bandeirinhas) -->
  <div class="modal-overlay" id="modalCnpj">
    <div class="modal-box modal-cnpj-box">
      <div class="modal-topo">
        <h3>Verificar CNPJ por Unidade</h3>
        <button class="modal-fechar" data-fechar="modalCnpj">&times;</button>
      </div>
      <div class="modal-corpo">
        <p class="cnpj-instrucao">Passe o mouse para ver o nome e clique em uma unidade para ver os dados de CNPJ.</p>
        <div id="bandeiraGrid" class="bandeira-grid">
          <!-- bandeirinhas inseridas via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: Detalhe do CNPJ de uma unidade -->
  <div class="modal-overlay" id="modalDetalhe">
    <div class="modal-box modal-detalhe-box">
      <div class="modal-topo">
        <h3 id="detalheTitulo">Unidade</h3>
        <button class="modal-fechar" data-fechar="modalDetalhe">&times;</button>
      </div>
      <div class="modal-corpo">
        <div id="detalheConteudo"></div>
      </div>
    </div>
  </div>

  <script src="js/lancamento.js"></script>
  <script>
    // Bloqueia o clique com o botão direito do mouse
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Bloqueia atalhos de teclado específicos
    document.addEventListener('keydown', function (event) {
      // Bloqueia Ctrl+C (Copiar)
      if (event.ctrlKey && event.key === 'c') {
        event.preventDefault();
      }
      // Bloqueia Ctrl+U (Ver código fonte)
      if (event.ctrlKey && event.key === 'u') {
        event.preventDefault();
      }
      // Bloqueia Ctrl+Shift+I ou F12 (Tentar abrir o Elementos/F12)
      if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I')) {
        event.preventDefault();
      }
    });
  </script>
</body>

</html>
